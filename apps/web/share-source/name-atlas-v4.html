<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #170a17;
      }
      .c {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(700px 520px at 80% 55%, #3a1a22 0%, transparent 70%),
          radial-gradient(500px 400px at 0% 0%, #2a1610 0%, transparent 70%), #170a17;
      }
      svg#s {
        position: absolute;
        inset: 0;
      }
      .brand {
        position: absolute;
        left: 72px;
        top: 56px;
        display: flex;
        align-items: center;
        gap: 14px;
        font:
          600 26px "Instrument Sans",
          sans-serif;
        color: #fffaf3;
        letter-spacing: -0.01em;
      }
      .t {
        position: absolute;
        left: 72px;
        top: 150px;
        width: 640px;
        color: #fffaf3;
      }
      h1 {
        font:
          500 82px/1 Fraunces,
          serif;
        letter-spacing: -0.025em;
      }
      h1 em {
        font-style: italic;
        color: #fcbf5b;
      }
      p {
        font:
          400 26px/1.4 "Instrument Sans",
          sans-serif;
        color: #e8d9de;
        margin-top: 26px;
        max-width: 540px;
      }
      .row {
        position: absolute;
        left: 72px;
        bottom: 58px;
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .cta {
        font:
          600 22px "Instrument Sans",
          sans-serif;
        color: #2a1610;
        background: #fcbf5b;
        padding: 16px 26px;
        border-radius: 999px;
      }
      .url {
        font:
          500 20px "IBM Plex Mono",
          monospace;
        color: #d9b8c4;
        letter-spacing: 0.04em;
      }
      .tag {
        position: absolute;
        right: 56px;
        bottom: 58px;
        display: flex;
        gap: 10px;
      }
      .tag span {
        font:
          500 18px "IBM Plex Mono",
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fffaf3;
        background: rgba(23, 10, 23, 0.7);
        border: 1px solid rgba(252, 191, 91, 0.45);
        padding: 10px 14px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <svg id="s" width="1200" height="630"></svg>
      <div class="brand">
        <svg
          width="44"
          height="44"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 96 96"
          role="img"
          aria-label="Name Atlas"
        >
          <path
            d="M16 82 C16 58 17 34 23 14 C35 20 40 39 49 54 C57 68 64 80 73 82 C78 63 79 39 82 14"
            fill="none"
            stroke="#fffaf3"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M22 82 C22 60 23 39 28 21 C38 27 43 43 50 56 C57 68 63 76 70 78 C74 61 75 42 77 21"
            fill="none"
            stroke="#fffaf3"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M28 78 C28 60 29 43 33 28 C41 33 45 46 51 57 C56 67 61 73 67 74 C70 60 71 45 73 28"
            fill="none"
            stroke="#fffaf3"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M34 73 C34 59 35 47 38 35 C44 39 47 49 52 58 C56 65 60 69 64 70 C66 59 67 48 68 35"
            fill="none"
            stroke="#fffaf3"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M40 67 C40 57 41 50 43 43 C47 46 49 52 53 58 C56 63 58 66 61 66 C62 58 63 51 63 43"
            fill="none"
            stroke="#fffaf3"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="69" cy="57" r="4.5" fill="#1e4fd7" /></svg
        >Name Atlas
      </div>
      <div class="t">
        <h1>Każde nazwisko gdzieś się <em>zaczęło.</em></h1>
        <p>Sprawdź swoje. Liczby, miejsca i historia tam, gdzie potwierdzają ją źródła.</p>
      </div>
      <div class="row">
        <span class="cta">Sprawdź za darmo</span><span class="url">name-atlas.pl</span>
      </div>
      <div class="tag"><span>Liczby</span><span>Miejsca</span><span>Źródła</span></div>
    </div>
    <script>
      const P = [
        [14.2, 53.9],
        [16.0, 54.3],
        [17.5, 54.8],
        [18.6, 54.75],
        [19.6, 54.4],
        [21.0, 54.35],
        [22.8, 54.35],
        [23.5, 53.9],
        [23.9, 53.0],
        [23.6, 52.6],
        [23.2, 52.2],
        [23.6, 51.6],
        [24.1, 51.0],
        [23.9, 50.4],
        [23.0, 49.8],
        [22.6, 49.1],
        [21.4, 49.4],
        [20.3, 49.3],
        [19.4, 49.6],
        [18.8, 49.5],
        [17.9, 50.0],
        [16.8, 50.4],
        [16.2, 50.6],
        [15.0, 51.0],
        [14.8, 51.4],
        [14.6, 52.0],
        [14.4, 53.2],
      ];
      const k = 82,
        ox = 700,
        oy = 70,
        pr = ([lo, la]) => [ox + (lo - 14) * k * 0.616, oy + (55 - la) * k];
      const poly = P.map(pr);
      const inside = (x, y) => {
        let c = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const [xi, yi] = poly[i],
            [xj, yj] = poly[j];
          if (yi > y != yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
        }
        return c;
      };
      let seed = 11;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const hubs = [
        [19.0, 50.25, 1],
        [21.0, 52.23, 0.9],
        [19.45, 51.76, 0.7],
        [16.9, 52.4, 0.6],
        [18.6, 54.35, 0.55],
        [17.03, 51.1, 0.6],
        [22.57, 51.25, 0.5],
        [20.0, 50.06, 0.8],
      ].map(([lo, la, w]) => [...pr([lo, la]), w]);
      const s = document.getElementById("s"),
        el = (t, a) => {
          const e = document.createElementNS("http://www.w3.org/2000/svg", t);
          for (const n in a) e.setAttribute(n, a[n]);
          s.appendChild(e);
          return e;
        };
      for (let r = 1; r <= 10; r++)
        el("ellipse", {
          cx: 950,
          cy: 330,
          rx: 60 * r,
          ry: 50 * r,
          fill: "none",
          stroke: "#fcbf5b",
          "stroke-opacity": 0.05,
        });
      el("path", {
        d: "M" + poly.map((p) => p.join(",")).join("L") + "Z",
        fill: "#fffaf3",
        "fill-opacity": 0.025,
        stroke: "#d9b8c4",
        "stroke-opacity": 0.3,
        "stroke-dasharray": "2 4",
      });
      const g = 11;
      for (let y = 60; y < 620; y += g * 0.87)
        for (let x = 680, row = Math.round(y / (g * 0.87)); x < 1200; x += g) {
          const xx = x + (row % 2 ? g / 2 : 0);
          if (!inside(xx, y)) continue;
          let d = 0.12;
          for (const [hx, hy, w] of hubs) {
            const dd = Math.hypot(xx - hx, y - hy);
            d += w * Math.exp(-(dd * dd) / (2 * 42 * 42));
          }
          d += rnd() * 0.12;
          el("circle", {
            cx: xx,
            cy: y,
            r: Math.min(4, 1 + d * 2.8),
            fill: d > 0.75 ? "#fcbf5b" : d > 0.42 ? "#c77a3e" : "#d9b8c4",
            "fill-opacity": d > 0.42 ? 0.9 : 0.3,
          });
        }
      const H = hubs.map((h) => [h[0], h[1]]);
      [
        [0, 1],
        [1, 3],
        [3, 4],
        [0, 5],
        [1, 6],
        [2, 1],
        [7, 0],
      ].forEach(([a, b]) => {
        const [x1, y1] = H[a],
          [x2, y2] = H[b];
        el("path", {
          d: `M${x1},${y1}Q${(x1 + x2) / 2},${(y1 + y2) / 2 - 40} ${x2},${y2}`,
          fill: "none",
          stroke: "#fcbf5b",
          "stroke-opacity": 0.4,
        });
      });
      H.forEach(([x, y]) => {
        el("circle", {
          cx: x,
          cy: y,
          r: 10,
          fill: "none",
          stroke: "#fcbf5b",
          "stroke-opacity": 0.7,
        });
        el("circle", { cx: x, cy: y, r: 3.5, fill: "#fffaf3" });
      });
    </script>
  </body>
</html>
