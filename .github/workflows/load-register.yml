name: Load the register into production

# TASK-035. Builds the complete 2026-01-20 PESEL register from the four
# official files, then, in `production` mode, replaces production's data with
# it in one transaction.
#
# The build is `pnpm local:setup`: download and SHA-256-verify, migrate,
# import, slugs, derive. On this private repository's runners (2 CPUs) it can
# take longer than the 6 hours a job may run, so two jobs run it in turn:
#   build-1  `pnpm local:setup` for at most 4h50m, then a checkpoint of the
#            database. The setup is resumable, so stopping it loses nothing.
#   build-2  restores the checkpoint, finishes `pnpm local:setup`, checks the
#            build against the register and dumps its data.
#   load     production only: migrates production, then in one transaction
#            deletes its data, restores the build's and runs ANALYZE, then
#            compares the two. If anything fails, production keeps what it had.
# The checkpoint and the dump pass between jobs through the Actions cache.
#
# A pull request that changes this file runs both build jobs on a few thousand
# surnames: the mechanics and the rates on a real runner, never the whole
# register and never production.
#
# A Claude Code web session cannot open a PostgreSQL connection to Supabase
# (its egress proxy carries HTTPS only), so this runs here instead.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build: build and report only. production: also replace production's data."
        type: choice
        options:
          - build
          - production
        default: build
      confirm:
        description: "For production: type the Supabase project ref (xujctkjpvnmcdpximtda)."
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/load-register.yml

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('load-register-pr-{0}', github.event.pull_request.number) || 'load-register' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # `bash` named explicitly runs with -e and -o pipefail.
    shell: bash

env:
  # The pinned image CI and Testcontainers use (ADR-0002, D-005).
  IMAGE: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
  # The data tables the importers and the derivation write. Not the migration
  # bookkeeping, not PostGIS's spatial_ref_sys, not the runtime outbox; no
  # foreign key points into these from outside them.
  DATA_TABLES: >-
    rights_profiles sources source_records knowledge_entities surnames name_forms
    surname_slugs places place_names entity_external_ids research_runs
    distribution_snapshots distribution_values evidence_items evidence_dependencies
    claims claim_evidence confidence_assessments citations
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/name_atlas
  BUILD_PSQL: postgresql://postgres:postgres@localhost:5432/name_atlas
  # A pull request derives this many surnames per pass, not the register.
  DERIVE_LIMIT: ${{ github.event_name == 'pull_request' && '6000' || '' }}
  CHECKPOINT_KEY: load-register-${{ github.run_id }}-checkpoint
  DUMP_KEY: load-register-${{ github.run_id }}-dump

jobs:
  build-1:
    name: "Build, part 1: download, import, derive"
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Refuse production without confirmation and a connection string
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'production'
        env:
          CONFIRM: ${{ inputs.confirm }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ "$CONFIRM" != "xujctkjpvnmcdpximtda" ]; then
            echo "::error::Type the Supabase project ref in 'confirm' to replace production's data."
            exit 1
          fi
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::The repository secret PROD_DATABASE_URL is not set."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make room on the disks
        run: |
          # The finished build is about 16 GB; the runner's toolchains we do not use are larger.
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          root="$HOME/register"
          if [ -d /mnt ] && [ "$(df -BG --output=avail /mnt | tail -1 | tr -dc 0-9)" -gt "$(df -BG --output=avail "$HOME" | tail -1 | tr -dc 0-9)" ]; then
            root=/mnt/register
          fi
          sudo mkdir -p "$root"
          sudo chown "$(id -u):$(id -g)" "$root"
          echo "REGISTER_ROOT=$root" >> "$GITHUB_ENV"
          df -h / /mnt 2>/dev/null || df -h /
          echo "database directory: $root/pgdata"
          psql --version; pg_dump --version; nproc; free -g

      - name: Start the build database
        run: |
          # Throwaway: durability off, which changes how fast it writes, not what it holds.
          docker run -d --name build-db --shm-size=1g -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=name_atlas \
            -v "$REGISTER_ROOT/pgdata:/var/lib/postgresql/data" \
            "$IMAGE" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c shared_buffers=2GB -c max_wal_size=2GB -c checkpoint_timeout=30min
          for _ in $(seq 1 120); do pg_isready -q -h localhost -p 5432 && break; sleep 2; done
          psql "$BUILD_PSQL" -v ON_ERROR_STOP=1 -tAc "select version(), postgis_lib_version()"

      - name: Build (pnpm local:setup), for at most 4h50m
        run: |
          set +e
          timeout --kill-after=2m 290m pnpm local:setup
          rc=$?
          set -e
          case "$rc" in
            0) echo "::notice::The build finished in part 1." ;;
            124 | 137) echo "::notice::Stopped after 4h50m; part 2 continues where this stopped." ;;
            *) exit "$rc" ;;
          esac

      - name: Stop the database and pack it
        run: |
          docker stop -t 600 build-db
          sudo tar -C "$REGISTER_ROOT" -cf - pgdata | zstd -T0 -3 -q -o "$RUNNER_TEMP/checkpoint.tar.zst"
          ls -lh "$RUNNER_TEMP/checkpoint.tar.zst"
          df -h / /mnt 2>/dev/null || df -h /

      - name: Save the checkpoint for part 2
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/checkpoint.tar.zst
          key: ${{ env.CHECKPOINT_KEY }}

  build-2:
    name: "Build, part 2: finish, check, dump"
    needs: build-1
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write # to delete the checkpoint once it is used

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make room on the disks
        run: |
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          root="$HOME/register"
          if [ -d /mnt ] && [ "$(df -BG --output=avail /mnt | tail -1 | tr -dc 0-9)" -gt "$(df -BG --output=avail "$HOME" | tail -1 | tr -dc 0-9)" ]; then
            root=/mnt/register
          fi
          sudo mkdir -p "$root"
          sudo chown "$(id -u):$(id -g)" "$root"
          echo "REGISTER_ROOT=$root" >> "$GITHUB_ENV"
          echo "database directory: $root/pgdata"

      - name: Restore the checkpoint from part 1
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/checkpoint.tar.zst
          key: ${{ env.CHECKPOINT_KEY }}
          fail-on-cache-miss: true

      - name: Unpack it and start the build database
        run: |
          zstd -dc "$RUNNER_TEMP/checkpoint.tar.zst" | sudo tar -C "$REGISTER_ROOT" -xpf -
          rm "$RUNNER_TEMP/checkpoint.tar.zst"
          docker run -d --name build-db --shm-size=1g -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=name_atlas \
            -v "$REGISTER_ROOT/pgdata:/var/lib/postgresql/data" \
            "$IMAGE" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c shared_buffers=2GB -c max_wal_size=2GB -c checkpoint_timeout=30min
          for _ in $(seq 1 120); do pg_isready -q -h localhost -p 5432 && break; sleep 2; done
          psql "$BUILD_PSQL" -v ON_ERROR_STOP=1 -tAc "select count(*) from surnames"

      - name: Finish the build (pnpm local:setup resumes)
        run: |
          set +e
          timeout --kill-after=2m 290m pnpm local:setup
          rc=$?
          set -e
          if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
            echo "::error::The build did not finish in two parts. It needs a third job."
          fi
          exit "$rc"

      - name: Check the build against the register before anything else
        run: |
          q() { psql "$BUILD_PSQL" -v ON_ERROR_STOP=1 -tAc "$1"; }
          surnames=$(q "select count(*) from surnames")
          national=$(q "select count(*) from distribution_values where place_id is null")
          records=$(q "select count(*) from source_records")
          # One ACTIVE claim per claim_key (type, surname, resource); at most two of a
          # type per surname, one from each of the male and female files.
          duplicates=$(q "select count(*) from (select 1 from claims where claim_status = 'ACTIVE' group by claim_key having count(*) > 1) d")
          overfull=$(q "select count(*) from (select 1 from claims where claim_status = 'ACTIVE' group by subject_entity_id, claim_type having count(*) > 2) d")
          echo "surnames=$surnames national_values=$national source_records=$records duplicate_active_claims=$duplicates more_than_two_of_a_type=$overfull"
          [ "$surnames" = "598476" ] || { echo "::error::expected 598,476 surnames"; exit 1; }
          [ "$national" = "828264" ] || { echo "::error::expected 408,182 + 420,082 national values"; exit 1; }
          [ "$records" = "4" ] || { echo "::error::expected four source records"; exit 1; }
          [ "$duplicates" = "0" ] || { echo "::error::two ACTIVE claims share a claim_key"; exit 1; }
          [ "$overfull" = "0" ] || { echo "::error::a surname has more than two ACTIVE claims of one type"; exit 1; }
          # The four official SHA-256s pinned in packages/sources/src/registry.ts, sorted.
          hashes=$(q "select string_agg(content_hash, ',' order by content_hash) from source_records")
          expected="0eb31d19955fbbb0a04c7693fb3e2515bc821515c31486851215f1482bee1b51,c508680d084dd21949ca7c817339fd63d31342ee5318320c5266c6bf4909f6e6,cd0c100e9205cffef594a16129e65c4a8373b62c49dcbb5fd7ed3ae27f7b6989,ce4238feda85e75c73b16a229eb8afc1dfccb8854a7809111ab85fb8672b62f4"
          [ "$hashes" = "$expected" ] || { echo "::error::source records do not carry the four official SHA-256 values"; exit 1; }
          # Every surname derived: what `derive-batch --all --rank` would still pick up.
          underived=$(q "select count(*) from surnames s where s.entity_status = 'ACTIVE' and not (
              exists (select 1 from claims c where c.subject_entity_id = s.surname_id and c.claim_type = 'CURRENT_POPULATION' and c.claim_status = 'ACTIVE')
              and exists (select 1 from claims c where c.subject_entity_id = s.surname_id and c.claim_type = 'CURRENT_RANK' and c.claim_status = 'ACTIVE')
              and exists (select 1 from claims c where c.subject_entity_id = s.surname_id and c.claim_type = 'RARITY_CONTEXT' and c.claim_status = 'ACTIVE'))")
          echo "surnames not yet derived: $underived"
          if [ -z "$DERIVE_LIMIT" ]; then
            [ "$underived" = "0" ] || { echo "::error::$underived surnames are not derived"; exit 1; }
          fi
          q "select claim_type, count(*) from claims where claim_status = 'ACTIVE' group by 1 order by 1"
          q "select pg_size_pretty(pg_database_size(current_database()))"

      - name: Dump the build's data and count its rows
        run: |
          mkdir -p "$RUNNER_TEMP/register-dump"
          tables=()
          for t in $DATA_TABLES; do tables+=("--table=public.$t"); done
          pg_dump "$BUILD_PSQL" --data-only --format=custom --no-owner --no-privileges "${tables[@]}" \
            -f "$RUNNER_TEMP/register-dump/register.dump"
          for t in $DATA_TABLES; do echo "SELECT '$t', count(*) FROM public.$t;"; done \
            | psql "$BUILD_PSQL" -X -q -tA -F' ' -v ON_ERROR_STOP=1 -f - > "$RUNNER_TEMP/register-dump/counts.txt"
          cat "$RUNNER_TEMP/register-dump/counts.txt"
          ls -lh "$RUNNER_TEMP/register-dump"
          df -h / /mnt 2>/dev/null || df -h /

      - name: Save the dump for the load
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'production'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/register-dump
          key: ${{ env.DUMP_KEY }}

      - name: Delete the checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "$CHECKPOINT_KEY" --repo "$GITHUB_REPOSITORY" || true

  load:
    name: "Replace production's data"
    needs: build-2
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write # to delete the dump once production holds it

    steps:
      - name: Refuse production without confirmation and a connection string
        env:
          CONFIRM: ${{ inputs.confirm }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ "$CONFIRM" != "xujctkjpvnmcdpximtda" ]; then
            echo "::error::Type the Supabase project ref in 'confirm' to replace production's data."
            exit 1
          fi
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::The repository secret PROD_DATABASE_URL is not set."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the build's dump
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/register-dump
          key: ${{ env.DUMP_KEY }}
          fail-on-cache-miss: true

      - name: Migrate production
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Replace production's data in one transaction
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          # libpq refuses node-postgres's `uselibpqcompat` parameter; keep the rest.
          PROD_PSQL=$(python3 -c 'import os, urllib.parse as u; p = u.urlsplit(os.environ["PROD_DATABASE_URL"]); q = [(k, v) for k, v in u.parse_qsl(p.query) if k != "uselibpqcompat"]; print(u.urlunsplit(p._replace(query=u.urlencode(q))))')
          echo "::add-mask::$PROD_PSQL"
          echo "PROD_PSQL=$PROD_PSQL" >> "$RUNNER_TEMP/prod.env"
          analyze=""
          for t in $DATA_TABLES; do analyze="$analyze${analyze:+, }public.$t"; done
          # COMMIT is written only after pg_restore has succeeded. If it fails, or
          # psql stops on an error, the transaction is never committed and
          # production keeps what it had. Supabase's platform default
          # statement_timeout is 2 minutes, so it is lifted for this session; the
          # replica role skips foreign-key triggers, as Supabase's restore guide
          # does, because the build enforced them. DELETE rather than TRUNCATE:
          # readers keep seeing the old rows until COMMIT instead of waiting.
          {
            echo "BEGIN;"
            echo "SET statement_timeout = 0;"
            echo "SET session_replication_role = replica;"
            for t in $DATA_TABLES; do echo "DELETE FROM public.$t;"; done
            pg_restore --data-only --no-owner --no-privileges -f - "$RUNNER_TEMP/register-dump/register.dump" || exit 1
            echo "ANALYZE $analyze;"
            echo "COMMIT;"
          } | psql "$PROD_PSQL" -X -q -o /dev/null -v ON_ERROR_STOP=1 -f -

      - name: Compare production with the build, table by table
        run: |
          . "$RUNNER_TEMP/prod.env"
          { echo "SET statement_timeout = 0;"; for t in $DATA_TABLES; do echo "SELECT '$t', count(*) FROM public.$t;"; done; } \
            | psql "$PROD_PSQL" -X -q -tA -F' ' -v ON_ERROR_STOP=1 -f - > "$RUNNER_TEMP/production-counts.txt"
          paste -d' ' "$RUNNER_TEMP/register-dump/counts.txt" "$RUNNER_TEMP/production-counts.txt" | awk '{ print $1, "build=" $2, "production=" $4 }'
          diff "$RUNNER_TEMP/register-dump/counts.txt" "$RUNNER_TEMP/production-counts.txt" \
            || { echo "::error::production differs from the build"; exit 1; }
          p() { printf 'SET statement_timeout = 0;\n%s\n' "$1" | psql "$PROD_PSQL" -X -q -tA -v ON_ERROR_STOP=1 -f -; }
          echo "national values: $(p "select count(*) from distribution_values where place_id is null")"
          echo "source record hashes: $(p "select string_agg(content_hash, ',' order by content_hash) from source_records")"
          echo "ACTIVE claims sharing a claim_key: $(p "select count(*) from (select 1 from claims where claim_status = 'ACTIVE' group by claim_key having count(*) > 1) d")"
          p "select claim_type, count(*) from claims where claim_status = 'ACTIVE' group by 1 order by 1"
          echo "database size: $(p "select pg_size_pretty(pg_database_size(current_database()))")"

      - name: Delete the dump
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "$DUMP_KEY" --repo "$GITHUB_REPOSITORY" || true
