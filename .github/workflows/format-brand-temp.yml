name: Temporary brand formatter

on:
  push:
    branches:
      - task-147-brand-system-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-147-brand-system-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >
          pnpm exec prettier --write
          apps/web/src/app/dev/brand/page.tsx
          apps/web/src/design-system/brand-system.css
          apps/web/src/design-system/components/index.tsx
          apps/web/src/design-system/maps/index.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/dev/brand/page.tsx apps/web/src/design-system/brand-system.css apps/web/src/design-system/components/index.tsx apps/web/src/design-system/maps/index.ts
          git commit -m "TASK-147: format brand-system files"
          git push origin HEAD:task-147-brand-system-v1
