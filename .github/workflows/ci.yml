name: CI

on:
  push:
  pull_request:

env:
  # Must match POSTGRES_TEST_IMAGE in packages/testing/src/postgres-container.ts
  # (ADR-0002, D-005 in docs/DECISIONS_NEEDED.md) — the same pinned image is
  # used for the db:migrate check below, for CI, and for Testcontainers.
  POSTGRES_TEST_IMAGE: "postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5"

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: name_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/name_atlas

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Apply bootstrap migration
        run: pnpm db:migrate

      # The generated types must depend only on the schema this project owns.
      # The pinned postgis/postgis image's own init script loads four
      # extensions into every database, two of which — postgis_tiger_geocoder
      # and postgis_topology — create the `tiger` and `topology` schemas full
      # of tables. kysely-codegen introspects every schema it can see, so
      # without the --include-pattern="public.*" in db's generate-types script
      # this check compares a CI database against a baseline generated on a
      # database that never had those extensions, and can never pass.
      - name: Verify generated types are current
        run: |
          pnpm db:generate-types
          git diff --exit-code -- packages/db/src/generated

      - name: Integration tests (Testcontainers)
        run: pnpm test:integration

      - name: Build
        run: pnpm build
