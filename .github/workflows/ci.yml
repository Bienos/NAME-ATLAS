name: CI

on:
  # A push runs CI on main only. Any other branch is verified by its pull
  # request, which already runs this workflow on the merge with main; running
  # it on the push as well billed every change twice (from #31;
  # docs/progress/2026-09-30-repository-cleanup.md).
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels that pull request's run still in
# progress: its result is for a commit nobody will merge. 28 such runs spent
# about 125 minutes between 2026-09-01 and 2026-10-04. A push to main is never
# cancelled: the group is its own commit, and Release needs `verify` to have
# passed on that very commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must match POSTGRES_TEST_IMAGE in packages/testing/src/postgres-container.ts
  # (ADR-0002, D-005 in docs/DECISIONS_NEEDED.md) — the same pinned image is
  # used for the db:migrate check below, for CI, and for Testcontainers.
  POSTGRES_TEST_IMAGE: "postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5"

jobs:
  verify:
    runs-on: ubuntu-latest
    # The slowest of 531 runs took 11.5 minutes (before the end-to-end steps
    # were added). Without this a hung job runs for GitHub's default 360.
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: name_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/name_atlas

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # On a pull request this runs on the merge with main, so it refuses a
      # branch that reuses a task, ADR, migration or decision number already
      # on main (AGENTS.md §11).
      - name: Unique task, ADR, migration and decision numbers
        run: pnpm check:ids

      # The database VM's scripts parse, and none of their dumps copies the rows
      # of schemas accounts or family (TASK-063, 068). The off-host backup
      # streams private rows into encryption (TASK-049).
      - name: VM scripts and dumps
        run: pnpm check:vm

      - name: Backup failure and retention regressions
        run: python3 scripts/test-backup.py

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Verify generated types are current
        run: |
          pnpm db:generate-types
          git diff --exit-code -- packages/db/src/generated

      - name: Integration tests (Testcontainers)
        run: pnpm test:integration

      # docs/canonical/17 §13 and §21: "Any golden-case occurrence blocks
      # release." That is only true if the corpus runs where releases are
      # gated, so it runs here and its failure fails the build.
      - name: Golden test corpus (Testcontainers)
        run: pnpm test:golden

      - name: Build
        run: pnpm build

      # TASK-103: the reader's journey on the built site, in Chromium at a
      # desktop and a phone size, against the committed fixtures seeded into
      # the database the migrations step prepared.
      - name: Seed the end-to-end database
        run: pnpm e2e:seed

      - name: Install Chromium for Playwright
        run: pnpm --filter @name-atlas/e2e-tests exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: pnpm test:e2e

      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/test-results/
          retention-days: 7
