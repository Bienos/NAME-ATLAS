name: Temporary TASK-149 formatter

on:
  push:
    branches:
      - task-149-dark-atlas-frontend

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-149-dark-atlas-frontend
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >
          pnpm exec prettier --write
          apps/web/src/app/icon.svg
          apps/web/src/app/layout.tsx
          apps/web/src/design-system/public-dark-atlas.css
          apps/web/src/lib/dusk-world.tsx
          apps/web/src/lib/og-card.tsx
          apps/web/src/lib/share-card.tsx
          apps/web/src/lib/site-footer.tsx
          apps/web/src/lib/site-nav.tsx
          apps/web/src/lib/site-shell.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/icon.svg apps/web/src/app/layout.tsx apps/web/src/design-system/public-dark-atlas.css apps/web/src/lib/dusk-world.tsx apps/web/src/lib/og-card.tsx apps/web/src/lib/share-card.tsx apps/web/src/lib/site-footer.tsx apps/web/src/lib/site-nav.tsx apps/web/src/lib/site-shell.tsx
          git commit -m "TASK-149: format Dark Atlas migration files"
          git push origin HEAD:task-149-dark-atlas-frontend
