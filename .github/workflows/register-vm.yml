name: Register VM

# Operates the production database VM (ADR-0017, TASK-042) over SSH: the Claude
# session that drives it has HTTPS-only egress, so this runner does the work and
# the run log is how the session sees it. It never runs on an ordinary push. A
# push runs it only when the push changes ops/vm/request on the branch below,
# and the step it runs is that file's first word. workflow_dispatch runs a step
# by name once this file is on the default branch.
#
#   check      the machine, before anything is installed; pins nothing, prints the host key
#   provision  ops/vm/provision.sh: PostgreSQL, PostGIS, PgBouncer, roles, firewall, Node
#   build      ops/vm/build.sh: starts the register build on the VM and returns
#   status     ops/vm/status.sh: the build, the database, the services, the machine
#   finalize   ops/vm/finalize.sh: the gate, durability, grants, ANALYZE, prewarm, dump
#   editions   ops/vm/editions.sh: every earlier PESEL edition as dated snapshots (TASK-045)
#   extras     ops/vm/extras.sh (TASK-041, 069): TERYT and the onomastic sources, after finalize
#   shift          ops/vm/shift.sh start (TASK-051): migrate, then start the change-over-time batch and return
#   shift-finish   ops/vm/shift.sh finish: the gate, grants, ANALYZE, dump, once the batch has completed
#   archive        ops/vm/archive.sh (TASK-054): migrate, then start Polona's archive load and return;
#                  the input top_rank sets its rank limit (TASK-087; 2000 when empty);
#                  restart_archive stops a running load and starts it again on this commit (TASK-099)
#   bearers        ops/vm/bearers.sh (TASK-077): migrate, then start Wikidata's well-known bearers load and return;
#                  the input top_rank sets its rank limit too (TASK-125; 2000 when empty, 301370 or more for every
#                  surname, in batches, TASK-140, ADR-0044); restart_bearers stops a running load and starts it again on this commit
#   meanings       ops/vm/meanings.sh (TASK-081): migrate, import the current Buryan 1933 file, derive its meanings, the gate
#   given-names    ops/vm/given-names.sh (TASK-133): migrate, download and import the PESEL first-name lists, derive every
#                  name's count and rank on each list, the gate
#   given-name-births  ops/vm/given-name-births.sh (TASK-142): migrate, download and import the first names given to
#                  children (dataset 219), derive each name's count, rank and trend, the gate
#   backup         ops/vm/backup.sh (TASK-049): encrypted off-host copy, including accounts and family
#   accounts       ops/vm/accounts.sh (TASK-063): migrate, the role nameatlas_app and its password, PgBouncer's user list, the isolation checks; repeatable
#   staging        ops/vm/staging.sh refresh (ADR-0039): copies production into name_atlas_staging without the rows of accounts and
#                  family, then migrates the copy to the pushed commit; the role nameatlas_staging_web and its password, PgBouncer
#   staging-migrate  ops/vm/staging.sh migrate: migrates the staging copy to the pushed commit; production is not touched
#
# provision, status, finalize, editions, extras, shift-finish, archive, bearers, meanings, given-names and given-name-births end by
# connecting the way the web app does;
# accounts ends by connecting the way the accounts connection does (nameatlas_app, with its own secret);
# staging and staging-migrate end by connecting the way staging.name-atlas.pl does (nameatlas_staging_web).

on:
  push:
    branches: [claude/eager-brown-s2u6qh, claude/awesome-darwin-af7l50]
    paths: [ops/vm/request]
  workflow_dispatch:
    inputs:
      step:
        description: Which step to run
        required: true
        type: choice
        options:
          [
            check,
            provision,
            build,
            status,
            finalize,
            editions,
            extras,
            shift,
            shift-finish,
            archive,
            bearers,
            meanings,
            given-names,
            given-name-births,
            accounts,
            backup,
            staging,
            staging-migrate,
          ]
      top_rank:
        description: archive and bearers, the rank limit on either register list (empty for 2000; 999999 for every surname)
        required: false
        type: string
        default: ""
      restart_archive:
        description: archive only, stop a running archive load and start it again on this commit
        required: false
        type: boolean
        default: false
      restart_bearers:
        description: bearers only, stop a running bearers load and start it again on this commit
        required: false
        type: boolean
        default: false

concurrency:
  group: register-vm
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_USER: ubuntu
      PINNED_HOST_KEY: ops/vm/ssh_host_ed25519_key.pub
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Choose the step
        id: step
        env:
          INPUT_STEP: ${{ inputs.step }}
        run: |
          step="${INPUT_STEP:-}"
          if [ -z "$step" ]; then
            step=$(awk 'NF && $1 !~ /^#/ { print $1; exit }' ops/vm/request)
          fi
          case "$step" in
            "") echo "::notice::ops/vm/request names no step; nothing to do" ;;
            check | provision | build | status | finalize | editions | extras | shift | shift-finish | archive | bearers | meanings | given-names | given-name-births | accounts | backup | staging | staging-migrate) echo "::notice::step: $step" ;;
            *) echo "::error::unknown step '$step'"; exit 1 ;;
          esac
          echo "step=$step" >> "$GITHUB_OUTPUT"

      - name: Refuse without the VM's secrets
        if: steps.step.outputs.step != ''
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          [ -n "$VM_HOST" ] || { echo "::error::repository secret VM_HOST is not set"; exit 1; }
          [ -n "$VM_SSH_KEY" ] || { echo "::error::repository secret VM_SSH_KEY is not set"; exit 1; }

      - name: Set up SSH with the VM's pinned host key
        if: steps.step.outputs.step != ''
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          STEP: ${{ steps.step.outputs.step }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          if [ -s "$PINNED_HOST_KEY" ]; then
            printf '%s %s\n' "$VM_HOST" "$(awk '{ print $1" "$2; exit }' "$PINNED_HOST_KEY")" \
              > ~/.ssh/known_hosts
          else
            # First contact only: every other step refuses an unpinned host.
            if [ "$STEP" != check ]; then
              echo "::error::pin the VM's host key in $PINNED_HOST_KEY first (the check step prints it)"
              exit 1
            fi
            scanned=$(ssh-keyscan -t ed25519 -T 20 "$VM_HOST" 2> keyscan.err |
              awk '$2 == "ssh-ed25519" { print $2" "$3; exit }') || true
            if [ -z "$scanned" ]; then
              cat keyscan.err >&2
              nc -zv -w 20 "$VM_HOST" 22 || true
              echo "::error::no ed25519 host key from the VM on port 22. In the connection test" \
                "above, 'timed out' means a firewall, the security list or a wrong or private IP;" \
                "'refused' means sshd is not listening."
              exit 1
            fi
            echo "Host key to pin in $PINNED_HOST_KEY (first contact, trusted on first use):"
            echo "$scanned"
            printf '%s %s\n' "$VM_HOST" "$scanned" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $VM_HOST
            User $VM_SSH_USER
            IdentityFile ~/.ssh/id_vm
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
            ConnectTimeout 20
          EOF
          ssh vm true
          # Staged in the SSH user's own home, which no other user on the VM can
          # write to, and run from there with sudo.
          ssh vm 'install -m 700 -d ~/name-atlas-ops'

      - name: check
        if: steps.step.outputs.step == 'check'
        run: |
          ssh vm '. /etc/os-release; echo "$PRETTY_NAME"; uname -mr; nproc; free -m; df -h /;
            lsblk -o NAME,SIZE,TYPE,MOUNTPOINT; locale -a | head -n 20;
            sudo iptables -L INPUT --line-numbers -n'

      - name: provision
        if: steps.step.outputs.step == 'provision'
        env:
          VM_DB_WEB_PASSWORD: ${{ secrets.VM_DB_WEB_PASSWORD }}
        run: |
          [ -n "$VM_DB_WEB_PASSWORD" ] ||
            { echo "::error::repository secret VM_DB_WEB_PASSWORD is not set"; exit 1; }
          # A copied secret often carries a trailing newline or space; those are dropped.
          pw=$(printf '%s' "$VM_DB_WEB_PASSWORD" | tr -d '[:space:]')
          [ "${#pw}" = "${#VM_DB_WEB_PASSWORD}" ] ||
            echo "::notice::VM_DB_WEB_PASSWORD had whitespace in it; it was removed"
          if ! [[ "$pw" =~ ^[A-Za-z0-9]{24,128}$ ]]; then
            echo "::error::VM_DB_WEB_PASSWORD has ${#pw} characters and must be 24 to 128 letters and" \
              "digits only: no symbols, dashes or spaces, because it goes into a URL"
            exit 1
          fi
          scp -q ops/vm/provision.sh vm:name-atlas-ops/provision.sh
          # The password goes to the script's stdin, never into a command line.
          ssh vm 'sudo bash ~/name-atlas-ops/provision.sh' <<< "$pw"

      - name: build
        if: steps.step.outputs.step == 'build'
        run: |
          git archive --format=tar.gz HEAD | ssh vm 'cat > ~/name-atlas-ops/app.tar.gz'
          scp -q ops/vm/build.sh vm:name-atlas-ops/build.sh
          ssh vm 'sudo bash ~/name-atlas-ops/build.sh ~/name-atlas-ops/app.tar.gz'

      - name: status
        if: steps.step.outputs.step == 'status'
        run: |
          scp -q ops/vm/status.sh vm:name-atlas-ops/status.sh
          ssh vm 'sudo bash ~/name-atlas-ops/status.sh'

      - name: finalize
        if: steps.step.outputs.step == 'finalize'
        run: |
          scp -q ops/vm/finalize.sh vm:name-atlas-ops/finalize.sh
          ssh vm 'sudo bash ~/name-atlas-ops/finalize.sh'

      - name: editions
        if: steps.step.outputs.step == 'editions'
        run: |
          # The pushed commit's tree, because the importers and the registry it
          # needs are newer than the one the build unpacked.
          git archive --format=tar.gz HEAD | ssh vm 'cat > ~/name-atlas-ops/app.tar.gz'
          scp -q ops/vm/editions.sh vm:name-atlas-ops/editions.sh
          ssh vm 'sudo bash ~/name-atlas-ops/editions.sh ~/name-atlas-ops/app.tar.gz'

      - name: extras
        if: steps.step.outputs.step == 'extras'
        run: |
          scp -q ops/vm/extras.sh datasets/onomastics/onomastica-64-16-walkowiak.json vm:name-atlas-ops/
          ssh vm 'sudo install -d -o nameatlas -g nameatlas -m 755 /srv/name-atlas/app/datasets/onomastics;
            sudo install -o nameatlas -g nameatlas -m 644 ~/name-atlas-ops/onomastica-64-16-walkowiak.json /srv/name-atlas/app/datasets/onomastics/onomastica-64-16-walkowiak.json'
          ssh vm 'sudo bash ~/name-atlas-ops/extras.sh'

      - name: shift
        if: steps.step.outputs.step == 'shift'
        run: |
          # The pushed commit's tree: the registry, the derivation and the
          # migration it needs are newer than the one the build unpacked.
          git archive --format=tar.gz HEAD | ssh vm 'cat > ~/name-atlas-ops/app.tar.gz'
          scp -q ops/vm/shift.sh vm:name-atlas-ops/shift.sh
          ssh vm 'sudo bash ~/name-atlas-ops/shift.sh start ~/name-atlas-ops/app.tar.gz'

      - name: shift-finish
        if: steps.step.outputs.step == 'shift-finish'
        run: |
          scp -q ops/vm/shift.sh vm:name-atlas-ops/shift.sh
          ssh vm 'sudo bash ~/name-atlas-ops/shift.sh finish'

      - name: archive
        if: steps.step.outputs.step == 'archive'
        env:
          TOP_RANK: ${{ inputs.top_rank }}
          RESTART_ARCHIVE: ${{ inputs.restart_archive }}
        run: |
          # Digits only: the value goes into the command line on the VM (TASK-087).
          top_rank=$(printf '%s' "$TOP_RANK" | tr -d '[:space:]')
          if [ -z "$top_rank" ]; then
            top_rank=2000
          elif ! [[ "$top_rank" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "::error::top_rank must be a whole number from 1 to 999999, got '$TOP_RANK'"
            exit 1
          fi
          echo "::notice::archive rank limit: $top_rank"
          restart=""
          if [ "$RESTART_ARCHIVE" = true ]; then
            restart=restart
            echo "::notice::a running archive load is restarted on this commit"
          fi
          # The pushed commit's tree: the loader, and migration 0025 it needs.
          git archive --format=tar.gz HEAD | ssh vm 'cat > ~/name-atlas-ops/app.tar.gz'
          scp -q ops/vm/archive.sh vm:name-atlas-ops/archive.sh
          ssh vm "sudo bash ~/name-atlas-ops/archive.sh ~/name-atlas-ops/app.tar.gz $top_rank $restart"

      - name: bearers
        if: steps.step.outputs.step == 'bearers'
        env:
          TOP_RANK: ${{ inputs.top_rank }}
          RESTART_BEARERS: ${{ inputs.restart_bearers }}
        run: |
          # Digits only: the value goes into the command line on the VM (TASK-087, TASK-125).
          top_rank=$(printf '%s' "$TOP_RANK" | tr -d '[:space:]')
          if [ -z "$top_rank" ]; then
            top_rank=2000
          elif ! [[ "$top_rank" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "::error::top_rank must be a whole number from 1 to 999999, got '$TOP_RANK'"
            exit 1
          fi
          echo "::notice::bearers rank limit: $top_rank"
          restart=""
          if [ "$RESTART_BEARERS" = true ]; then
            restart=restart
            echo "::notice::a running bearers load is restarted on this commit"
          fi
          # The pushed commit's tree: the loader, and migration 0029 it needs.
          git archive --format=tar.gz HEAD | ssh vm 'cat > ~/name-atlas-ops/app.tar.gz'
          scp -q ops/vm/bearers.sh vm:name-atlas-ops/bearers.sh
          ssh vm "sudo bash ~/name-atlas-ops/bearers.sh ~/name-atlas-ops/app.tar.gz $top_rank $restart"

      - name: meanings
        if: steps.step.outputs.step == 'meanings'
        run: |
          # The pushed commit's tree: the source file and the code that imports it.
          git archive --format=tar.gz HEAD | ssh vm 'cat > ~/name-atlas-ops/app.tar.gz'
          scp -q ops/vm/meanings.sh vm:name-atlas-ops/meanings.sh
          ssh vm 'sudo bash ~/name-atlas-ops/meanings.sh ~/name-atlas-ops/app.tar.gz'

      - name: given-names
        if: steps.step.outputs.step == 'given-names'
        run: |
          # The pushed commit's tree: the registry the files are checked against, the
          # metadata, the importer and the derivation, and migrations 0031, 0038 and 0039.
          git archive --format=tar.gz HEAD | ssh vm 'cat > ~/name-atlas-ops/app.tar.gz'
          scp -q ops/vm/given-names.sh vm:name-atlas-ops/given-names.sh
          ssh vm 'sudo bash ~/name-atlas-ops/given-names.sh ~/name-atlas-ops/app.tar.gz'

      - name: given-name-births
        if: steps.step.outputs.step == 'given-name-births'
        run: |
          # The pushed commit's tree: the registry the files are checked against, the
          # metadata, the importer and the derivation, and migrations 0040 and 0041.
          git archive --format=tar.gz HEAD | ssh vm 'cat > ~/name-atlas-ops/app.tar.gz'
          scp -q ops/vm/given-name-births.sh vm:name-atlas-ops/given-name-births.sh
          ssh vm 'sudo bash ~/name-atlas-ops/given-name-births.sh ~/name-atlas-ops/app.tar.gz'

      - name: accounts
        if: steps.step.outputs.step == 'accounts'
        env:
          VM_DB_APP_PASSWORD: ${{ secrets.VM_DB_APP_PASSWORD }}
        run: |
          [ -n "$VM_DB_APP_PASSWORD" ] ||
            { echo "::error::repository secret VM_DB_APP_PASSWORD is not set"; exit 1; }
          # A copied secret often carries a trailing newline or space; those are dropped.
          pw=$(printf '%s' "$VM_DB_APP_PASSWORD" | tr -d '[:space:]')
          [ "${#pw}" = "${#VM_DB_APP_PASSWORD}" ] ||
            echo "::notice::VM_DB_APP_PASSWORD had whitespace in it; it was removed"
          if ! [[ "$pw" =~ ^[A-Za-z0-9]{24,128}$ ]]; then
            echo "::error::VM_DB_APP_PASSWORD has ${#pw} characters and must be 24 to 128 letters and" \
              "digits only: no symbols, dashes or spaces, because it goes into a URL"
            exit 1
          fi
          # The pushed commit's tree: the migrations it needs are newer than the one the build unpacked.
          git archive --format=tar.gz HEAD | ssh vm 'cat > ~/name-atlas-ops/app.tar.gz'
          scp -q ops/vm/accounts.sh ops/vm/accounts-roles.sql vm:name-atlas-ops/
          # The password goes to the script's stdin, never into a command line.
          ssh vm 'sudo bash ~/name-atlas-ops/accounts.sh ~/name-atlas-ops/app.tar.gz ~/name-atlas-ops/accounts-roles.sql' <<< "$pw"

      - name: backup
        if: steps.step.outputs.step == 'backup'
        env:
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
        run: |
          for key in BACKUP_AGE_RECIPIENT BACKUP_R2_BUCKET BACKUP_R2_ENDPOINT BACKUP_R2_ACCESS_KEY_ID BACKUP_R2_SECRET_ACCESS_KEY; do
            [ -n "${!key}" ] || { echo "::error::repository secret $key is not set"; exit 1; }
          done
          scp -q ops/vm/backup.sh ops/vm/backup-check.ts vm:name-atlas-ops/
          # The helper reads aggregate counts and the public sample payload; no
          # migration or dependency installation is performed by this step.
          ssh vm 'sudo install -o nameatlas -g nameatlas -m 644 ~/name-atlas-ops/backup-check.ts /srv/name-atlas/app/ops/vm/backup-check.ts'
          # Secrets travel over SSH stdin, never in command arguments or logs.
          printf '%s\n' "$BACKUP_AGE_RECIPIENT" "$BACKUP_R2_BUCKET" "$BACKUP_R2_ENDPOINT" \
            "$BACKUP_R2_ACCESS_KEY_ID" "$BACKUP_R2_SECRET_ACCESS_KEY" |
            ssh vm 'sudo bash ~/name-atlas-ops/backup.sh --stdin'

      - name: staging
        if: steps.step.outputs.step == 'staging'
        env:
          VM_DB_STAGING_WEB_PASSWORD: ${{ secrets.VM_DB_STAGING_WEB_PASSWORD }}
        run: |
          [ -n "$VM_DB_STAGING_WEB_PASSWORD" ] ||
            { echo "::error::repository secret VM_DB_STAGING_WEB_PASSWORD is not set"; exit 1; }
          # A copied secret often carries a trailing newline or space; those are dropped.
          pw=$(printf '%s' "$VM_DB_STAGING_WEB_PASSWORD" | tr -d '[:space:]')
          [ "${#pw}" = "${#VM_DB_STAGING_WEB_PASSWORD}" ] ||
            echo "::notice::VM_DB_STAGING_WEB_PASSWORD had whitespace in it; it was removed"
          if ! [[ "$pw" =~ ^[A-Za-z0-9]{24,128}$ ]]; then
            echo "::error::VM_DB_STAGING_WEB_PASSWORD has ${#pw} characters and must be 24 to 128 letters and" \
              "digits only: no symbols, dashes or spaces, because it goes into a URL"
            exit 1
          fi
          # The pushed commit's tree: the migrations the staging copy is brought up to.
          git archive --format=tar.gz HEAD | ssh vm 'cat > ~/name-atlas-ops/app.tar.gz'
          scp -q ops/vm/staging.sh vm:name-atlas-ops/staging.sh
          # The password goes to the script's stdin, never into a command line.
          ssh vm 'sudo bash ~/name-atlas-ops/staging.sh refresh ~/name-atlas-ops/app.tar.gz' <<< "$pw"

      - name: staging-migrate
        if: steps.step.outputs.step == 'staging-migrate'
        run: |
          git archive --format=tar.gz HEAD | ssh vm 'cat > ~/name-atlas-ops/app.tar.gz'
          scp -q ops/vm/staging.sh vm:name-atlas-ops/staging.sh
          ssh vm 'sudo bash ~/name-atlas-ops/staging.sh migrate ~/name-atlas-ops/app.tar.gz'

      - name: Connect as the web app does (TLS, SCRAM, PgBouncer, read-only)
        if: >-
          steps.step.outputs.step == 'provision' || steps.step.outputs.step == 'status' ||
          steps.step.outputs.step == 'finalize' || steps.step.outputs.step == 'editions' ||
          steps.step.outputs.step == 'extras' || steps.step.outputs.step == 'shift-finish' ||
          steps.step.outputs.step == 'archive' || steps.step.outputs.step == 'bearers' ||
          steps.step.outputs.step == 'meanings' || steps.step.outputs.step == 'given-names' ||
          steps.step.outputs.step == 'given-name-births'
        env:
          PGPASSWORD: ${{ secrets.VM_DB_WEB_PASSWORD }}
        run: |
          PGPASSWORD=$(printf '%s' "$PGPASSWORD" | tr -d '[:space:]')
          export PGPASSWORD
          if ! nc -z -w 10 "$VM_HOST" 6432; then
            echo "::error::TCP port 6432 on the VM does not answer from the internet. The host's" \
              "firewall was opened by provision; a timeout here means Oracle's network blocks it." \
              "In the console: the instance's subnet > Default Security List > Add Ingress Rules:" \
              "source 0.0.0.0/0, TCP, destination port 6432, stateless not ticked."
            exit 1
          fi
          conn="host=$VM_HOST port=6432 dbname=name_atlas user=nameatlas_web sslmode=require connect_timeout=15"
          p() { psql "$conn" -X -v ON_ERROR_STOP=1 -tA "$@"; }
          p -c '\conninfo'
          p -c "SELECT current_user, current_setting('default_transaction_read_only'),
                       current_setting('statement_timeout'), version()"
          if [ "$(p -c "SELECT to_regclass('public.surnames') IS NOT NULL")" = t ]; then
            p -c "SELECT 'surnames ' || count(*) FROM surnames"
            p -c "SELECT 'places ' || count(*) FROM places"
            p -c "SELECT 'SURNAME_MEANING claims ' || count(*) FROM claims
                  WHERE claim_type = 'SURNAME_MEANING' AND claim_status = 'ACTIVE'"
            p -c "SELECT 'change claims ' || count(*) FROM claims
                  WHERE claim_type::text = 'SURNAME_DISTRIBUTION_SHIFT' AND claim_status = 'ACTIVE'"
            p -c "SELECT 'NOTABLE_BEARERS claims ' || count(*) FROM claims
                  WHERE claim_type::text = 'NOTABLE_BEARERS' AND claim_status = 'ACTIVE'"
            p -c "SELECT claim_type::text || ' claims ' || count(*) FROM claims
                  WHERE claim_type::text IN ('GIVEN_NAME_POPULATION', 'GIVEN_NAME_RANK')
                    AND claim_status = 'ACTIVE' GROUP BY claim_type::text ORDER BY 1"
            p -c "SELECT claim_type::text || ' claims ' || count(*) FROM claims
                  WHERE claim_type::text IN ('GIVEN_NAME_BIRTH_COUNT', 'GIVEN_NAME_BIRTH_RANK', 'GIVEN_NAME_BIRTH_TREND')
                    AND claim_status = 'ACTIVE' GROUP BY claim_type::text ORDER BY 1"
          fi
          if p -c 'CREATE TABLE public.web_role_must_not_write (x int)' 2> write.err; then
            echo "::error::the web role could create a table"
            exit 1
          fi
          echo "a write as the web role is refused: $(head -n 1 write.err)"

      - name: Connect as the accounts connection does (TLS, SCRAM, PgBouncer, accounts only)
        if: steps.step.outputs.step == 'accounts'
        env:
          PGPASSWORD: ${{ secrets.VM_DB_APP_PASSWORD }}
        run: |
          PGPASSWORD=$(printf '%s' "$PGPASSWORD" | tr -d '[:space:]')
          export PGPASSWORD
          conn="host=$VM_HOST port=6432 dbname=name_atlas user=nameatlas_app sslmode=require connect_timeout=15"
          p() { psql "$conn" -X -v ON_ERROR_STOP=1 -tA "$@"; }
          p -c '\conninfo'
          p -c "SELECT current_user, current_setting('statement_timeout'), version()"
          p -c "SELECT 'accounts.users ' || count(*) FROM accounts.users"
          if p -c 'SELECT 1 FROM public.kysely_migration LIMIT 1' 2> read.err; then
            echo "::error::the accounts role could read a table of the register"
            exit 1
          fi
          echo "a read of the register as the accounts role is refused: $(head -n 1 read.err)"
          # In a transaction that is rolled back, so a role wrongly allowed to create leaves nothing.
          if p -c 'BEGIN; CREATE TABLE accounts.must_not_exist (x int); ROLLBACK' 2> write.err; then
            echo "::error::the accounts role could create a table"
            exit 1
          fi
          echo "creating a table as the accounts role is refused: $(head -n 1 write.err)"

      - name: Connect as staging.name-atlas.pl does (TLS, SCRAM, PgBouncer, read-only, the copy only)
        if: steps.step.outputs.step == 'staging' || steps.step.outputs.step == 'staging-migrate'
        env:
          PGPASSWORD: ${{ secrets.VM_DB_STAGING_WEB_PASSWORD }}
        run: |
          PGPASSWORD=$(printf '%s' "$PGPASSWORD" | tr -d '[:space:]')
          export PGPASSWORD
          [ -n "$PGPASSWORD" ] || { echo "::error::repository secret VM_DB_STAGING_WEB_PASSWORD is not set"; exit 1; }
          conn="host=$VM_HOST port=6432 dbname=name_atlas_staging user=nameatlas_staging_web sslmode=require connect_timeout=15"
          p() { psql "$conn" -X -v ON_ERROR_STOP=1 -tA "$@"; }
          p -c '\conninfo'
          p -c "SELECT current_user, current_setting('default_transaction_read_only'),
                       current_setting('statement_timeout'), version()"
          p -c "SELECT 'surnames ' || count(*) FROM surnames"
          p -c "SELECT 'migrations ' || count(*) || ', last ' || max(name) FROM kysely_migration"
          if p -c 'CREATE TABLE public.staging_role_must_not_write (x int)' 2> write.err; then
            echo "::error::the staging role could create a table"
            exit 1
          fi
          echo "a write as the staging role is refused: $(head -n 1 write.err)"
          prod="host=$VM_HOST port=6432 dbname=name_atlas user=nameatlas_staging_web sslmode=require connect_timeout=15"
          if psql "$prod" -X -tAc 'SELECT 1' 2> prod.err; then
            echo "::error::the staging role could connect to the production database"
            exit 1
          fi
          echo "the production database refuses the staging role: $(head -n 1 prod.err)"
